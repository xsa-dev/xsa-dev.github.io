default_language = "ru"

taxonomies = [
    { name = "tags", feed = true }
]

[markdown]
smart_punctuation = true
bottom_footnotes = true
github_alerts = true
render_emoji = true

[markdown.highlighting]
theme = "ayu-dark"
style = "inline"

[search]
index_format = "fuse_json"

[extra]
default_theme = "dark"
accent_color = "#2563eb"
