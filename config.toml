title = "Notes & Insights"
base_url = "https://xsa-dev.github.io"
description = "Блог об архитектуре систем, AI-агентах, распределенных системах и алгоритмическом трейдинге."
author = "Alexei Savin"

theme = "duckquill"
compile_sass = true
