styles = ["custom.css"]
scripts = ["zoom.js", "dock-nav.js"]
show_copy_button = true
show_reading_time = true
show_share_button = true
show_backlinks = false
show_copyright = true
show_powered_by = false
katex = true
mermaid = true

toc = true
