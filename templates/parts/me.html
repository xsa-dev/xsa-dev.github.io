<div class="bio-intro" style="margin-bottom: 2rem;">
  <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 1rem;">
    <h1 style="margin: 0; font-size: 2rem; font-family: monospace;">{{ config.title }}</h1>
    {% if config.build_search_index %}
    <button id="search-open-btn" class="search-btn" aria-label="Поиск по сайту" title="Поиск (Ctrl+K)" style="cursor: pointer; background: transparent; border: 1px solid currentColor; color: inherit; font-family: monospace; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem;">
      🔍 [⌘K]
    </button>
    {% endif %}
  </div>
  <p style="margin: 0.8rem 0 0 0; opacity: 0.85; font-size: 1.05rem; line-height: 1.5;">
    {{ config.description }}
  </p>
  <div style="margin-top: 0.5rem; font-size: 0.95rem; opacity: 0.75;">
    <span>// {{ config.extra.author }} &bull; {{ config.extra.subtitle }}</span>
  </div>
</div>
