{% extends "base.html" %}

{% block title %}Теги - {{ config.title }}{% endblock title %}

{% block content %}
<header>
  <p><a href="/">..</a>/tags</p>
  <h2>// Все теги</h2>
</header>
<main>
  <div class="chips">
    {% for term in terms %}
    <p onclick="redirect('{{ term.path | safe }}')" style="cursor: pointer; margin-bottom: 0.8rem;">
      {{ term.pages | length }}x <span class="tag">{{ term.name }}</span>
    </p>
    {% endfor %}
  </div>
</main>
{% endblock content %}
